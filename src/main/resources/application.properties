spring.application.name=pedidos360-backend
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/3441157d-ea5c-483f-a66d-e45c3ed7f9da/v2.0
pedidos360.security.jwt.audience=5582b6c4-7ecd-4bed-9337-ba3f1f8e58e5

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ connection. Override credentials outside local development.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Pedidos event topology
pedidos360.rabbitmq.exchange=pedidos360.events
pedidos360.rabbitmq.queue=pedidos.pedido-creado.q
pedidos360.rabbitmq.routing-key=pedido.creado
pedidos360.rabbitmq.dead-letter-exchange=pedidos360.dlx
pedidos360.rabbitmq.dead-letter-queue=pedidos.pedido-creado.dlq
pedidos360.rabbitmq.dead-letter-routing-key=pedido.creado.dlq

# Bounded in-listener retries before rejecting to the dead-letter exchange
pedidos360.rabbitmq.retry.max-attempts=${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
pedidos360.rabbitmq.retry.initial-interval=${RABBITMQ_RETRY_INITIAL_INTERVAL:1000}
pedidos360.rabbitmq.retry.multiplier=${RABBITMQ_RETRY_MULTIPLIER:2.0}
pedidos360.rabbitmq.retry.max-interval=${RABBITMQ_RETRY_MAX_INTERVAL:5000}
